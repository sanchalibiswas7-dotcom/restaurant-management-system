{% extends "base.html" %}

{% block content %}
<h2 class="mb-3">Add Menu Item</h2>

<form method="post" action="{{ url_for('add_menu_item') }}" class="card p-3">
    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Category</label>
        <select name="category" class="form-select">
            <option>Starter</option>
            <option>Main</option>
            <option>Dessert</option>
            <option>Drink</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Price (₹)</label>
        <input type="number" step="0.01" name="price" class="form-control" required>
    </div>
    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="is_available" id="is_available" checked>
        <label class="form-check-label" for="is_available">
            Available
        </label>
    </div>
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{{ url_for('menu_list') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
