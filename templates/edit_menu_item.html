{% extends "base.html" %}

{% block content %}
<h2 class="mb-3">Edit Menu Item</h2>

<form method="post"
      action="{{ url_for('edit_menu_item', item_id=item.id) }}"
      class="card p-3">
    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control"
               value="{{ item.name }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Category</label>
        <select name="category" class="form-select">
            <option {% if item.category == 'Starter' %}selected{% endif %}>Starter</option>
            <option {% if item.category == 'Main' %}selected{% endif %}>Main</option>
            <option {% if item.category == 'Dessert' %}selected{% endif %}>Dessert</option>
            <option {% if item.category == 'Drink' %}selected{% endif %}>Drink</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Price (₹)</label>
        <input type="number" step="0.01" name="price" class="form-control"
               value="{{ item.price }}" required>
    </div>
    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="is_available"
               id="is_available"
               {% if item.is_available %}checked{% endif %}>
        <label class="form-check-label" for="is_available">
            Available
        </label>
    </div>
    <button type="submit" class="btn btn-success">Update</button>
    <a href="{{ url_for('menu_list') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
