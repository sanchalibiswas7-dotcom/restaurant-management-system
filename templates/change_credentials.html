{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Change Username & Password</h2>

<form method="post" class="card p-4" style="max-width: 500px;">
    <div class="mb-3">
        <label class="form-label">New Username</label>
        <input type="text"
               name="username"
               class="form-control"
               value="{{ session.get('username') }}"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password"
               name="password"
               class="form-control"
               required>
    </div>

    <button type="submit" class="btn btn-success">
        Update Credentials
    </button>

    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary ms-2">
        Cancel
    </a>
</form>
{% endblock %}
